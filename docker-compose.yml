name: goldenshake

services:
  db:
    image: postgres:15-alpine
    container_name: goldenshake-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldenshake}
      POSTGRES_USER: ${POSTGRES_USER:-goldenshake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldenshake} -d ${POSTGRES_DB:-goldenshake}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [goldenshake]

  redis:
    image: redis:7-alpine
    container_name: goldenshake-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [goldenshake]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: goldenshake-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-goldenshake}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-changeme123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [goldenshake]

  backend:
    build:
      context: ./backend
    container_name: goldenshake-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    entrypoint: ["/app/entrypoint.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    expose: ["8000"]
    networks: [goldenshake]

  celery:
    build:
      context: ./backend
    container_name: goldenshake-celery
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - media_files:/app/media
    depends_on:
      backend: {condition: service_started}
      redis: {condition: service_healthy}
    networks: [goldenshake]

  celery-beat:
    build:
      context: ./backend
    container_name: goldenshake-celery-beat
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    depends_on:
      backend: {condition: service_started}
      redis: {condition: service_healthy}
    networks: [goldenshake]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost}
    container_name: goldenshake-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost}
    depends_on: [backend]
    expose: ["3000"]
    networks: [goldenshake]

  nginx:
    image: nginx:1.27-alpine
    container_name: goldenshake-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on: [backend, frontend]
    networks: [goldenshake]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_files:
  media_files:

networks:
  goldenshake:
    driver: bridge
